name: Verify XOVA

on:
  push:
    branches:
      - feat/direct-gemini-tavily-search
  pull_request:
    branches:
      - feat/direct-gemini-tavily-search

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
